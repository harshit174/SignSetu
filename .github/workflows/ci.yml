name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install (CPU-only PyTorch)
        run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: python -m py_compile app.py isl_core.py isl_lang.py
      - name: Tests
        run: pytest -q
      - name: Notebook is in sync with the generated files
        run: python tools/sync_notebook.py --check
